<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ping Pong — Time Mode</title>
<style>
  :root{ --black:#000; }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0; font-family: system-ui, Arial;}
  body{display:flex; align-items:center; justify-content:center; background:#ffeb3b;}
  .app{ width:min(94vw,520px); margin:20px auto; }
  .card{ background:#fff; border:2px solid var(--black); box-shadow:8px 8px 0 var(--black); border-radius:14px; padding:16px; }
  /* HOME */
  #home{ display:flex; flex-direction:column; gap:12px; align-items:stretch; text-align:center; }
  #title{ font-weight:900; font-size:clamp(24px,6vw,34px); }
  .high-score{ font-weight:800; }
  .start-btn{ background:var(--black); color:#fff; border:none; padding:12px; font-weight:900; border-radius:0; cursor:pointer; }
  .credit{ font-size:12px; font-weight:700; }
  /* GAME */
  #game{ display:none; }
  .hud{ display:flex; justify-content:space-between; font-weight:800; margin-bottom:8px; }
  .stage-wrap{ position:relative; width:100%; aspect-ratio:9/14; border:3px solid var(--black); border-radius:12px; overflow:hidden; background:#ffeb3b; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* slider */
  .slider-wrap{ margin-top:12px; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:30px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track{ height:12px; background:var(--black); border-radius:8px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:24px; height:24px; background:#fff; border:3px solid var(--black); border-radius:50%; margin-top:-6px; }
  /* modal */
  .modal{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); }
  .modal-card{ background:#fff; border:2px solid var(--black); box-shadow:6px 6px 0 var(--black); border-radius:14px; padding:14px; width:min(92%,380px); text-align:center; transform:translateY(8px); opacity:0; transition:all 260ms ease; }
  .modal.show{ display:flex; }
  .modal.show .modal-card{ transform:translateY(0); opacity:1; }
  .btn-row{ display:flex; justify-content:center; gap:10px; margin-top:10px; }
  .btn{ background:var(--black); color:#fff; border:none; padding:10px 16px; font-weight:800; cursor:pointer; border-radius:8px; min-width:100px; }
  .popup-credit{ margin-top:8px; font-size:12px; font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <section id="home" class="card">
    <div id="title">PING PONG</div>
    <div class="high-score">Longest Time: <span id="highHome">0.00</span>s</div>
    <button id="startHome" class="start-btn">START</button>
    <div class="credit">CREATED BY ❤️ SHUBHANSHU</div>
  </section>
  <section id="game" class="card">
    <div class="hud"><div>Time: <span id="time">0.00</span>s</div><div>Best: <span id="highHud">0.00</span>s</div></div>
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage" width="360" height="560"></canvas>
      <div class="modal" id="gameOverModal">
        <div class="modal-card">
          <h2>GAME OVER</h2>
          <div style="font-weight:800">Time: <span id="finalTime">0.00</span>s</div>
          <div class="btn-row">
            <button class="btn" id="restartBtn">Restart</button>
            <button class="btn" id="homeBtn">Home</button>
          </div>
          <div class="popup-credit">CREATED BY ❤️ SHUBHANSHU</div>
        </div>
      </div>
    </div>
    <div class="slider-wrap">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px;">Move Paddle</div>
      <input type="range" id="paddleSlider" min="0" max="100" value="50" />
    </div>
  </section>
</div>

<script>
const homeScreen = document.getElementById('home');
const gameScreen = document.getElementById('game');
const startHome = document.getElementById('startHome');
const highHome = document.getElementById('highHome');
const highHud = document.getElementById('highHud');
const timeDisplay = document.getElementById('time');
const finalTimeDisplay = document.getElementById('finalTime');
const restartBtn = document.getElementById('restartBtn');
const homeBtn = document.getElementById('homeBtn');
const gameOverModal = document.getElementById('gameOverModal');
const slider = document.getElementById('paddleSlider');

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

let ball, paddle, time, highScore, baseSpeed, ballDX, ballDY, running, bgHue, timerInterval, startTime;

function resetGame() {
  time = 0;
  baseSpeed = 3; // starting speed
  ball = { x: canvas.width/2, y: canvas.height/2, r: 10 };
  paddle = { w: 80, h: 10, x: canvas.width/2 - 40, y: canvas.height - 30 };
  ballDX = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
  ballDY = -baseSpeed;
  bgHue = 50;
}

function draw() {
  ctx.fillStyle = `hsl(${bgHue}, 90%, 60%)`;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  bgHue += 0.2;

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = '#000';
  ctx.fill();

  ctx.fillStyle = '#000';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
}

function update() {
  // Increase speed based on elapsed time
  let speed = baseSpeed + time * 0.05; // grows continuously with time
  let dirX = Math.sign(ballDX) || 1;
  let dirY = Math.sign(ballDY) || -1;

  ball.x += dirX * speed;
  ball.y += dirY * speed;

  // wall bounce
  if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) {
    ballDX = -ballDX;
  }
  // ceiling bounce
  if (ball.y - ball.r < 0) {
    ballDY = -ballDY;
  }
  // paddle bounce
  if (ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
    ballDY = -Math.abs(ballDY);
  }
  // game over
  if (ball.y - ball.r > canvas.height) {
    gameOver();
  }
}

function loop() {
  if (!running) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  draw();
  update();
  requestAnimationFrame(loop);
}

function startTimer() {
  startTime = performance.now();
  timerInterval = setInterval(() => {
    let now = performance.now();
    time = (now - startTime) / 1000;
    timeDisplay.textContent = time.toFixed(2);
  }, 10);
}

function startGame() {
  running = true;
  resetGame();
  timeDisplay.textContent = "0.00";
  gameOverModal.classList.remove('show');
  clearInterval(timerInterval);
  startTimer();
  loop();
}

function gameOver() {
  running = false;
  clearInterval(timerInterval);
  finalTimeDisplay.textContent = time.toFixed(2);
  if (time > highScore) {
    highScore = time;
    localStorage.setItem('pingPongHighTimeMs', highScore);
  }
  highHome.textContent = highScore.toFixed(2);
  highHud.textContent = highScore.toFixed(2);
  setTimeout(() => gameOverModal.classList.add('show'), 200);
}

slider.addEventListener('input', e => {
  let percent = e.target.value / 100;
  paddle.x = percent * (canvas.width - paddle.w);
});

startHome.addEventListener('click', () => {
  homeScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  startGame();
});
restartBtn.addEventListener('click', startGame);
homeBtn.addEventListener('click', () => {
  gameOverModal.classList.remove('show');
  gameScreen.style.display = 'none';
  homeScreen.style.display = 'flex';
});

highScore = parseFloat(localStorage.getItem('pingPongHighTimeMs')) || 0;
highHome.textContent = highScore.toFixed(2);
highHud.textContent = highScore.toFixed(2);
</script>
</body>
</html>
